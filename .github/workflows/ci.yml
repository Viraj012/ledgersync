name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the Docker daemon that ubuntu-latest runners provide.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Build Docker image
        run: docker build -t ledgersync .
